<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Just Between Us ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Pacifico&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/qna.css" />
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <audio id="bg-music" loop>
    <source src="music/Penjaga Hati - Nadhif Basalamah _ Instrumental.mp3" type="audio/mp3">
  </audio>


  <main class="qna-scene">

    <div class="qna-container">

      <div class="qna-header">
        <div class="qna-heart-icon">♡</div>
        <h1 class="qna-title">Just Between Us</h1>
        <p class="qna-subtitle">Jawab jujur ya... aku tunggu ~</p>
      </div>

      <form class="qna-form" id="qnaForm">

        <!-- Pertanyaan 1 -->
        <div class="question-card" data-index="0">
          <label class="q-label">
            <span class="q-number">01</span>
            Apa kesan pertama kamu tentang aku?
          </label>
          <div class="input-wrapper">
            <textarea class="q-input" name="q1" placeholder="Tulis jawabanmu di sini..." rows="3" required></textarea>
            <span class="input-glow"></span>
          </div>
        </div>

        <!-- Pertanyaan 2 -->
        <div class="question-card" data-index="1">
          <label class="q-label">
            <span class="q-number">02</span>
            Hal yang paling kamu suka dari aku?
          </label>
          <div class="input-wrapper">
            <textarea class="q-input" name="q2" placeholder="Tulis jawabanmu di sini..." rows="3" required></textarea>
            <span class="input-glow"></span>
          </div>
        </div>

        <!-- Pertanyaan 3 -->
        <div class="question-card" data-index="2">
          <label class="q-label">
            <span class="q-number">03</span>
            Momen apa yang paling kamu ingat dari kita?
          </label>
          <div class="input-wrapper">
            <textarea class="q-input" name="q3" placeholder="Tulis jawabanmu di sini..." rows="3" required></textarea>
            <span class="input-glow"></span>
          </div>
        </div>

        <!-- Pertanyaan 4 -->
        <div class="question-card" data-index="3">
          <label class="q-label">
            <span class="q-number">04</span>
            Kalau bisa pergi ke mana saja bersama aku, kamu mau ke mana?
          </label>
          <div class="input-wrapper">
            <textarea class="q-input" name="q4" placeholder="Tulis jawabanmu di sini..." rows="3" required></textarea>
            <span class="input-glow"></span>
          </div>
        </div>

        <!-- Pertanyaan 5 -->
        <div class="question-card" data-index="4">
          <label class="q-label">
            <span class="q-number">05</span>
            Satu kata untuk menggambarkan perasaanmu setelah baca surat tadi?
          </label>
          <div class="input-wrapper">
            <textarea class="q-input" name="q5" placeholder="Tulis jawabanmu di sini..." rows="3" required></textarea>
            <span class="input-glow"></span>
          </div>
        </div>

        <!-- Submit button -->
        <div class="submit-area">
          <button type="submit" class="send-btn" id="sendBtn">
            <span class="send-text">Send Answer</span>
            <span class="send-icon">♡</span>
          </button>
          <p class="send-note">Jawabanmu akan aku simpan di hati 💌</p>
        </div>

      </form>

      <!-- Status message -->
      <div class="send-status" id="sendStatus" style="display:none;"></div>

    </div>

  </main>

  <!-- Page transition -->
  <div class="page-transition" id="pageTransition"></div>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/email.js"></script>
  <script src="js/qna.js"></script>
</body>
</html>
